name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  # The daily sync pushes to this tap with the repository's own token, and
  # GitHub does not start a workflow for a push made that way. Without the
  # triggers below these checks would never run on the commit the daily sync
  # makes, and a change that reached the tap untested would go unnoticed.
  workflow_dispatch:
  workflow_run:
    workflows:
      - sync tap with upstream releases
    types:
      - completed

jobs:
  test-bot:
    strategy:
      matrix:
        # The tap syntax check does not depend on the machine it runs on, and the
        # container carries the linters, so the macOS runners only matter for the
        # pull request build.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["macos-15-intel", "macos-26", "ubuntu-latest"]' || '["ubuntu-latest"]') }}
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # The tap syntax check does not depend on the machine it runs on, and the
      # container carries the linters that the macOS runners have to build from
      # source, so the check runs there.
      - run: brew test-bot --only-tap-syntax
        if: matrix.os == 'ubuntu-latest'
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
