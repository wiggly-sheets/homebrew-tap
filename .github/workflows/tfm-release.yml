name: tfm Release (macOS)

# Produces tfm-universal-macos.gz for Homebrew formula integration.
# The full cross-platform release workflow lives in .github/workflows/release.yml.
# This workflow focuses on macOS artifacts for the wiggly-sheets/homebrew-tap.

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Version matches package.json
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "${{ github.ref_name }}"

      - name: Install dependencies
        run: bun install --frozen-lockfile --os='*' --cpu='*'

      - name: Build universal macOS binary
        run: bun build --compile --target=macos-universal src/index.ts assets/icons/*.svg --outfile dist/tfm-macos-universal

      - name: Package + checksum
        run: |
          gzip -kf dist/tfm-macos-universal
          shasum -a 256 dist/tfm-macos-universal.gz > dist/tfm-macos-universal.gz.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tfm-macos-universal.gz
            dist/tfm-macos-universal.gz.sha256
          generate_release_notes: true